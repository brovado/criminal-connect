<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Criminal Connect</title>
<style>
body{font-family:Arial,sans-serif;background:#111;color:#eee;padding:15px;max-width:1100px;margin:auto}.game{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}.boardWrap{flex:1;min-width:460px}#board{display:grid;grid-template-columns:repeat(7,64px);gap:5px;background:#181818;padding:8px;border-radius:8px;width:max-content}.cell{width:64px;height:64px;border:1px solid #555;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#222;cursor:pointer;position:relative;box-sizing:border-box}.cell:hover{border-color:#aaa}.cell.op4{box-shadow:0 0 0 3px #777}.cell.op5{box-shadow:0 0 0 3px #aaa}.cell.op6{box-shadow:0 0 0 3px #ddd}.cell.op7{box-shadow:0 0 0 4px #ffd700}.pip{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#fff}.blue{background:#4a7dff}.red{background:#ff5a5a}.capturedAsset{position:absolute;inset:5px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#fff;font-size:22px;border:2px solid #ffd700;z-index:2}.capturedAsset.blue{background:#4a7dff}.capturedAsset.red{background:#ff5a5a}.neutralAsset{position:absolute;inset:5px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#ffd700;font-size:22px;border:2px solid #ffd700;z-index:2;background:#222}.debris{position:absolute;inset:8px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#777;font-size:22px;border:2px dashed #666;background:#151515;z-index:2;cursor:not-allowed}.optag{position:absolute;top:-3px;left:-3px;font-size:9px;background:#111;border:1px solid #777;border-radius:4px;padding:1px 3px;z-index:4}.operation{border-left:3px solid #777;padding:7px 9px;margin:6px 0;background:#222;border-radius:4px}.operation.op5{border-left-color:#aaa}.operation.op6{border-left-color:#ddd}.operation.op7{border-left-color:#ffd700}.operation b{display:block}.small{font-size:12px;color:#aaa}.good{color:#8fda8f}.bad{color:#ff7777}button{margin:4px;padding:8px 12px;background:#292929;color:#eee;border:1px solid #555;border-radius:5px;cursor:pointer}button:hover{background:#383838}button:disabled{opacity:.4;cursor:not-allowed}.networkActions{display:flex;gap:6px;margin-top:10px;border-top:1px solid #333;padding-top:8px}.networkActions button{flex:1;margin:0}.primary{font-weight:bold}.resourceBar{display:flex;align-items:center;gap:18px;margin-top:10px;padding:10px 14px;background:#1b1b1b;border:1px solid #333;border-radius:8px}.resource{display:flex;align-items:center;gap:7px;min-width:82px}.resourceOrb{width:30px;height:30px;border-radius:50%;background:#666;border:2px solid #888;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#eee;flex:none}.resourceValue{font-weight:bold}.resourceLabel{font-size:11px;color:#999}.dayInfo{margin-left:auto;text-align:right;font-size:12px;color:#aaa}.dayInfo b{color:#eee;font-size:14px}.income{margin-top:8px;padding:8px;background:#202020;border-radius:5px}.income div{margin:3px 0}#gameModal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}#gameModal.open{display:flex}.modalCard{width:min(560px,100%);max-height:80vh;overflow:auto;background:#1b1b1b;border:1px solid #555;border-radius:10px;box-shadow:0 20px 60px #000}.modalHeader{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #333}.modalHeader h2{margin:0}.modalClose{font-size:20px;padding:3px 9px}.modalBody{padding:14px 16px}.shopItem{padding:10px 0;border-bottom:1px solid #333}.shopItem:last-child{border-bottom:0}.shopItem button{float:right;margin:0}.shopItem small{color:#aaa}.modalHint{color:#999;font-size:12px;margin-top:4px}.shopSection{margin-top:14px;padding-top:10px;border-top:1px solid #444}.shopSection h3{margin:0 0 4px}.spawnItem{padding:9px 0;border-bottom:1px solid #333}.spawnItem:last-child{border-bottom:0}.spawnItem button{float:right;margin:0}
</style>
</head>
<body>
<h1>Criminal Connect</h1>
<div class="game">
  <div class="boardWrap">
    <div id="board"></div>
    <div class="small" style="margin-top:8px">Capture Assets by building 3 in a row directly into them. Gold coins can become your colour when they complete a Connect 4. Other Assets can be planted at the Fence. Debris blocks a space until you clear it.</div>
    <div class="resourceBar" id="resourceBar"></div>
  </div>
  <div class="panel" id="opsPanel"></div>
</div>
<div id="gameModal"><div class="modalCard"><div class="modalHeader"><h2 id="modalTitle"></h2><button class="modalClose" onclick="closeModal()">×</button></div><div class="modalBody" id="modalBody"></div></div></div>
<script>
const rows=6,cols=7,intelGoal=250,debrisCount=3;
let day=1,turn='blue',cash=10,favors=6,intel=0,heat=20,maxHeat=20,upgrades=[],demolitionCharges=0;
const board=Array.from({length:rows},()=>Array(cols).fill(null));
const assets=['$','F','I','H'];
const assetNames={'$':'Cash','F':'Favor','I':'Intel','H':'Heat'};
const spawnBasePrices={'F':15,'I':10,'H':12};
const spawnCounts={'F':0,'I':0,'H':0};
const demolitionBasePrice=25;
let demolitionPurchases=0;
const opNames=['The Safehouse','Smuggling Route','Blackmail Chain','Inside Job','The Long Con','Informant Chain','The Getaway','Dirty Money Trail','The Inside Job','No Witnesses'];
let placed=0;
while(placed<8){const r=Math.floor(Math.random()*rows),c=Math.floor(Math.random()*cols);if(!board[r][c]){board[r][c]={asset:'$'};placed++;}}
let debrisPlaced=0;
while(debrisPlaced<debrisCount){const r=Math.floor(Math.random()*rows),c=Math.floor(Math.random()*cols);if(!board[r][c]){board[r][c]={debris:true};debrisPlaced++;}}
const shopPool=[
 ['Inside Man',20,'Captured Assets inside Operations pay +1.'],
 ['Long Con',25,'Operations of length 5+ get x2.'],
 ['Informer',15,'Each Operation produces +2 Intel.'],
 ['Safehouse',15,'Reduce daily Heat cost by 1.'],
 ['Wheelman',20,'Start each day with +1 Favor.'],
 ['Mastermind',30,'Intel gains +25%.'],
 ['Double Take',20,'After each placement, switch color again.'],
 ['Pressure Valve',25,'Reduce daily Heat loss by 3.'],
 ['Cash Flow',15,'Double Cash from Operations.'],
 ['Legendary Score',40,'Length 7+ Operations get x2.']
];
let ops=[];
const boardEl=document.getElementById('board'),resourceBar=document.getElementById('resourceBar'),opsPanel=document.getElementById('opsPanel'),gameModal=document.getElementById('gameModal'),modalTitle=document.getElementById('modalTitle'),modalBody=document.getElementById('modalBody');
function opClass(len){return len>=7?'op7':len===6?'op6':len===5?'op5':'op4'}
function draw(){
 resourceBar.innerHTML=`<div class="resource"><div class="resourceOrb">$</div><div><div class="resourceValue">$${cash}</div><div class="resourceLabel">CASH</div></div></div><div class="resource"><div class="resourceOrb">F</div><div><div class="resourceValue">${favors}</div><div class="resourceLabel">FAVORS</div></div></div><div class="resource"><div class="resourceOrb">I</div><div><div class="resourceValue">${intel}/${intelGoal}</div><div class="resourceLabel">INTEL</div></div></div><div class="resource"><div class="resourceOrb">H</div><div><div class="resourceValue">${heat}/${maxHeat}</div><div class="resourceLabel">HEAT</div></div></div><div class="dayInfo"><b>DAY ${day}</b><br>Playing: ${turn.toUpperCase()}${demolitionCharges?`<br><span class="good">${demolitionCharges} charge${demolitionCharges===1?'':'s'} ready</span>`:''}</div>`;
 const opCells={};ops.forEach((o,i)=>o.cells.forEach(([r,c])=>{const key=`${r},${c}`;if(!opCells[key]||o.len>opCells[key].len)opCells[key]={len:o.len,index:i};}));
 boardEl.innerHTML='';
 for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
  const d=document.createElement('div'),v=board[r][c],oc=opCells[`${r},${c}`];d.className='cell'+(oc?' '+opClass(oc.len):'');
  if(v&&v.debris)d.innerHTML='<div class="debris" title="Debris — permanently blocked">×</div>';
  else if(v&&v.color&&v.asset)d.innerHTML=`<div class="capturedAsset ${v.color}" title="${assetNames[v.asset]} — ${v.color} controlled">${v.asset}</div>`;
  else if(v&&v.color)d.innerHTML=`<div class="pip ${v.color}">${v.color==='blue'?'B':'R'}</div>`;
  else if(v&&v.asset)d.innerHTML=`<div class="neutralAsset" title="Neutral ${assetNames[v.asset]}">${v.asset}</div>`;
  if(oc)d.innerHTML+=`<span class="optag">${oc.len}</span>`;
  d.onclick=()=>handleCellClick(r,c);
  boardEl.appendChild(d);
 }
 renderOperations();
}
function handleCellClick(r,c){
 if(demolitionCharges>0){
  if(board[r][c]?.debris){
   board[r][c]=null;demolitionCharges--;draw();openModal('Debris Cleared','<div class="good"><b>The obstruction is gone.</b></div><div class="modalHint">That space is now open and can be occupied normally.</div>');
  }else openModal('Charge Armed','<div class="modalHint">A demolition charge is ready. Click a debris marker to clear it.</div>');
  return;
 }
 drop(c);
}
function drop(c){
 if(favors<=0){openModal('No Favors','<div class="bad">You have no Favors left. End the Day to reset your action economy.</div>');return;}
 for(let r=rows-1;r>=0;r--){
  const v=board[r][c];
  if(v&&v.debris)continue;
  if(v&&v.occupied)continue;
  if(v&&v.asset)board[r][c]={asset:v.asset,occupied:true};
  else board[r][c]={color:turn,occupied:true};
  const captured=captureAssets(turn),capturedColor=turn;
  const coinConnections=promoteCoins(turn);
  turn=turn==='blue'?'red':'blue';favors--;if(upgrades.includes('Double Take'))turn=turn==='blue'?'red':'blue';
  draw();
  if(captured.length||coinConnections.length){
   const messages=[];
   if(captured.length)messages.push(`${captured.map(a=>assetNames[a.asset]).join(', ')} captured`);
   if(coinConnections.length)messages.push(`${coinConnections.length} Gold coin${coinConnections.length===1?'':'s'} joined the Connect 4`);
   openModal('Connection Made',`<div><b>${capturedColor==='blue'?'Blue':'Red'}: ${messages.join(' and ')}.</b></div><div class="modalHint">Gold coins are wild for Connect 4: when a coin completes a four-piece line, it permanently becomes that colour.</div>`);
  }
  return;
 }
 openModal('Column Full','<span class="bad">That column is full.</span>');
}
function hasColor(r,c,color){return !!board[r]?.[c]?.color&&board[r][c].color===color}
function captureAssets(color){
 const captured=[],dirs=[[1,0],[0,1],[1,1],[1,-1]];
 for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
  const v=board[r][c];if(!v||!v.asset||v.color||!v.occupied)continue;
  let claimed=false;
  for(const[dr,dc]of dirs){
   let count=0;
   for(let step=-1;step<=1;step+=2){let rr=r+dr*step,cc=c+dc*step;while(hasColor(rr,cc,color)&&count<3){count++;rr+=dr*step;cc+=dc*step;}}
   if(count>=3){v.color=color;captured.push(v);claimed=true;break;}
  }
  if(claimed)continue;
 }
 return captured;
}
function promoteCoins(color){
 const promoted=[],dirs=[[1,0],[0,1],[1,1],[1,-1]];
 for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
  const v=board[r][c];if(!v||v.asset!=='$'||v.color||!v.occupied)continue;
  let qualifies=false;
  for(const[dr,dc]of dirs){
   for(let start=-3;start<=0;start++){
    const coinOffset=-start;
    if(coinOffset<0||coinOffset>3)continue;
    let valid=true,hasCoin=false;
    for(let k=0;k<4;k++){
     const rr=r+(k-coinOffset)*dr,cc=c+(k-coinOffset)*dc;
     const cell=board[rr]?.[cc];
     if(rr===r&&cc===c){if(cell?.asset==='$'&&!cell.color)hasCoin=true;else valid=false;}
     else if(!hasColor(rr,cc,color))valid=false;
    }
    if(valid&&hasCoin){qualifies=true;break;}
   }
   if(qualifies)break;
  }
  if(qualifies){v.color=color;promoted.push(v);}
 }
 return promoted;
}
function scan(){
 const found=[],dirs=[[1,0],[0,1],[1,1],[1,-1]];
 for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
  const cell=board[r][c];if(!cell||!cell.color)continue;
  for(const[dr,dc]of dirs){const before=board[r-dr]?.[c-dc];if(before?.color===cell.color)continue;let len=1,cells=[[r,c]],nr=r+dr,nc=c+dc;while(board[nr]?.[nc]?.color===cell.color){cells.push([nr,nc]);len++;nr+=dr;nc+=dc;}if(len>=4)found.push({len,cells,color:cell.color});}
 }
 return found;
}
function calcOp(o){
 let mult=o.len===4?2:o.len===5?3:o.len===6?5:8;if(upgrades.includes('Long Con')&&o.len>=5)mult*=2;if(upgrades.includes('Legendary Score')&&o.len>=7)mult*=2;
 let c=0,i=0,h=0,f=0;o.cells.forEach(([r,col])=>{const v=board[r][col],a=v?.asset;if(!a||!v.color)return;if(a==='$')c+=mult;if(a==='I')i+=mult;if(a==='H')h+=mult;if(a==='F')f+=mult;});
 if(upgrades.includes('Inside Man')){const n=o.cells.filter(([r,col])=>board[r][col]?.asset&&board[r][col]?.color===o.color).length;c+=n;i+=n;h+=n;f+=n;}
 if(upgrades.includes('Cash Flow'))c*=2;if(upgrades.includes('Informer'))i+=2;return{c,i,h,f,mult};
}
function renderOperations(){
 let content='<h3>Your Network</h3>';
 if(!ops.length)content+='<div class="small">No Operations yet. Capture Assets and build a line of 4 or more to establish infrastructure.</div>';
 else content+=ops.map((o,i)=>{const x=calcOp(o),name=o.name||opNames[i%opNames.length];return `<div class="operation ${opClass(o.len)}"><b>${name}</b><span class="small">${o.len} pieces · ${o.color==='blue'?'Blue':'Red'} · pays each Day</span><div>Cash +$${x.c} · Intel +${x.i} · Heat +${x.h}${x.f?' · Favors +'+x.f:''}</div></div>`;}).join('');
 content+=`<div class="networkActions"><button onclick="openShop()">Fence / Shop</button><button class="primary" onclick="endDay()">End Day</button></div>`;opsPanel.innerHTML=content;
}
function openModal(title,body){modalTitle.textContent=title;modalBody.innerHTML=body;gameModal.classList.add('open')}
function closeModal(){gameModal.classList.remove('open')}
function spawnPrice(asset){return spawnBasePrices[asset]+spawnCounts[asset]*5}
function spawnResource(asset){
 const cost=spawnPrice(asset);
 if(cash<cost||intel>=intelGoal||heat<=0)return;
 const spots=[];for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)if(!board[r][c])spots.push([r,c]);
 if(!spots.length){openModal('No Room','<div class="bad">There is nowhere left on the board to plant another Asset.</div>');return;}
 const [r,c]=spots[Math.floor(Math.random()*spots.length)];
 board[r][c]={asset,planted:true};
 cash-=cost;spawnCounts[asset]++;
 openShop();draw();
}
function demolitionPrice(){return demolitionBasePrice+demolitionPurchases*10}
function buyDemolitionCharge(){
 const cost=demolitionPrice();
 if(cash<cost||intel>=intelGoal||heat<=0)return;
 cash-=cost;demolitionCharges++;demolitionPurchases++;
 closeModal();draw();openModal('Demolition Charge Armed',`<div><b>Charge ready.</b> Click any debris marker on the board to clear it.</div><div class="modalHint">The cleared space becomes permanently playable.</div>`);
}
function openShop(){
 modalTitle.textContent='Fence';
 const spawns=['F','I','H'].map(a=>{const cost=spawnPrice(a);return `<div class="spawnItem"><button ${cash<cost||intel>=intelGoal||heat<=0?'disabled':''} onclick="spawnResource('${a}')">Plant $${cost}</button><b>${assetNames[a]} Asset</b><br><small>Plant a neutral ${assetNames[a]} Asset in a random open spot. Next ${assetNames[a]} costs $${cost+5}.</small></div>`;}).join('');
 const dCost=demolitionPrice();
 const demolition=`<div class="spawnItem"><button ${cash<dCost||intel>=intelGoal||heat<=0?'disabled':''} onclick="buyDemolitionCharge()">Buy $${dCost}</button><b>Demolition Charge</b><br><small>Buy one charge, then click a Debris marker to destroy it. Next charge costs $${dCost+10}.</small></div>`;
 modalBody.innerHTML=`<div class="modalHint">Spend Cash on permanent upgrades. Bought upgrades remain for the run.</div><div class="shopSection"><h3>Plant an Asset</h3><div class="modalHint">Gold is already on the board. These resources can be planted from the Fence.</div>${spawns}</div><div class="shopSection"><h3>Clear the Way</h3>${demolition}</div><div class="shopSection"><h3>Upgrades</h3>${shopPool.map(s=>{const owned=upgrades.includes(s[0]);return `<div class="shopItem"><button ${cash<s[1]||owned||intel>=intelGoal||heat<=0?'disabled':''} onclick="buy('${s[0].replace(/'/g,"\\'")}',${s[1]})">${owned?'Owned':'Buy $'+s[1]}</button><b>${s[0]}</b><br><small>${s[2]}</small></div>`;}).join('')}</div>`;
 gameModal.classList.add('open');
}
function buy(n,c){if(cash<c||upgrades.includes(n)||intel>=intelGoal||heat<=0)return;cash-=c;upgrades.push(n);openShop();draw()}
function heatCost(){const base=day<=4?2:day<=8?3:day<=12?4:day<=16?5:6;return Math.max(0,base-(upgrades.includes('Pressure Valve')?3:0)-(upgrades.includes('Safehouse')?1:0))}
function endDay(){
 if(intel>=intelGoal||heat<=0)return;
 scan().forEach(op=>{const key=JSON.stringify(op.cells);if(!ops.find(o=>o.key===key))ops.push({key,len:op.len,cells:op.cells,color:op.color,name:opNames[ops.length%opNames.length]});});
 let dc=0,di=0,dh=0,df=0,lines=[];ops.forEach(o=>{const x=calcOp(o);dc+=x.c;di+=x.i;dh+=x.h;df+=x.f;lines.push(`<div><b>${o.name}</b>: +$${x.c} Cash, +${x.i} Intel${x.h?' , +'+x.h+' Heat':''}${x.f?' , +'+x.f+' Favors':''}</div>`);});
 if(upgrades.includes('Mastermind'))di=Math.ceil(di*1.25);cash+=dc;intel+=di;heat+=dh;favors+=df;const cost=heatCost();heat-=cost;const startF=2+(upgrades.includes('Wheelman')?1:0);favors+=startF;const paidDay=day;day++;
 let result=`<div><b>DAY ${paidDay} — THE NETWORK PAYS</b></div><div class="income">${lines.join('')||'<div>No Operations paid out.</div>'}<div>Heat cost: -${cost}</div><div>Daily Favors: +${df+startF}</div></div>`;
 if(intel>=intelGoal)result+='<p class="good"><b>BIG SCORE COMPLETE!</b> You gathered enough Intel to pull the job.</p>';else if(heat<=0)result+='<p class="bad"><b>BUSTED.</b> The Heat caught up with you.</p>';
 openModal('The Network Pays',result);draw();
}
gameModal.onclick=e=>{if(e.target===gameModal)closeModal()};draw();
</script>
</body>
</html>
