<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Criminal Connect</title><style>
body{font-family:Arial,sans-serif;background:#111;color:#eee;padding:15px;max-width:1100px;margin:auto}.panel{background:#1b1b1b;border:1px solid #333;border-radius:8px;padding:12px}.game{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}.boardWrap{flex:1;min-width:460px}#board{display:grid;grid-template-columns:repeat(7,64px);gap:5px;margin-top:0;background:#181818;padding:8px;border-radius:8px;width:max-content}.cell{width:64px;height:64px;border:1px solid #555;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#222;cursor:pointer;position:relative;box-sizing:border-box}.cell:hover{border-color:#aaa}.cell.op4{box-shadow:0 0 0 3px #777}.cell.op5{box-shadow:0 0 0 3px #aaa}.cell.op6{box-shadow:0 0 0 3px #ddd}.cell.op7{box-shadow:0 0 0 4px #ffd700}.pip{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#fff}.blue{background:#4a7dff}.red{background:#ff5a5a}.asset{position:absolute;bottom:2px;right:2px;width:19px;height:19px;border-radius:50%;background:#111;border:1px solid #ffd700;color:#ffd700;font-size:11px;display:flex;align-items:center;justify-content:center;z-index:3}.optag{position:absolute;top:-3px;left:-3px;font-size:9px;background:#111;border:1px solid #777;border-radius:4px;padding:1px 3px;z-index:4}.operation{border-left:3px solid #777;padding:7px 9px;margin:6px 0;background:#222;border-radius:4px}.operation.op5{border-left-color:#aaa}.operation.op6{border-left-color:#ddd}.operation.op7{border-left-color:#ffd700}.operation b{display:block}.small{font-size:12px;color:#aaa}.good{color:#8fda8f}.bad{color:#ff7777}button{margin:4px;padding:8px 12px;background:#292929;color:#eee;border:1px solid #555;border-radius:5px;cursor:pointer}button:hover{background:#383838}button:disabled{opacity:.4;cursor:not-allowed}.networkActions{display:flex;gap:6px;margin-top:10px;border-top:1px solid #333;padding-top:8px}.networkActions button{flex:1;margin:0}.primary{font-weight:bold}.resourceBar{display:flex;align-items:center;gap:18px;margin-top:10px;padding:10px 14px;background:#1b1b1b;border:1px solid #333;border-radius:8px}.resource{display:flex;align-items:center;gap:7px;min-width:82px}.resourceOrb{width:30px;height:30px;border-radius:50%;background:#666;border:2px solid #888;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#eee;flex:none}.resourceValue{font-weight:bold}.resourceLabel{font-size:11px;color:#999}.dayInfo{margin-left:auto;text-align:right;font-size:12px;color:#aaa}.dayInfo b{color:#eee;font-size:14px}.income{margin-top:8px;padding:8px;background:#202020;border-radius:5px}.income div{margin:3px 0}#gameModal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}#gameModal.open{display:flex}.modalCard{width:min(560px,100%);max-height:80vh;overflow:auto;background:#1b1b1b;border:1px solid #555;border-radius:10px;box-shadow:0 20px 60px #000}.modalHeader{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #333}.modalHeader h2{margin:0}.modalClose{font-size:20px;padding:3px 9px}.modalBody{padding:14px 16px}.shopItem{padding:10px 0;border-bottom:1px solid #333}.shopItem:last-child{border-bottom:0}.shopItem button{float:right;margin:0}.shopItem small{color:#aaa}.modalHint{color:#999;font-size:12px;margin-top:4px}
</style></head><body><h1>Criminal Connect</h1><div class="game"><div class="boardWrap"><div id="board"></div><div class="small" style="margin-top:8px">Operation rings: 4 = basic · 5 = strong · 6 = major · 7+ = legendary</div><div class="resourceBar" id="resourceBar"></div></div><div class="panel" id="opsPanel"></div></div><div id="gameModal"><div class="modalCard"><div class="modalHeader"><h2 id="modalTitle"></h2><button class="modalClose" onclick="closeModal()">×</button></div><div class="modalBody" id="modalBody"></div></div></div><script>
const rows=6,cols=7,intelGoal=100;let day=1,turn='blue',cash=10,favors=3,intel=0,heat=20,maxHeat=20,upgrades=[];const board=Array.from({length:rows},()=>Array(cols).fill(null)),assets=['$','F','I','H'];const assetNames={'$':'Cash','F':'Favor','I':'Intel','H':'Heat'};const opNames=['The Safehouse','Smuggling Route','Blackmail Chain','Inside Job','The Long Con','Informant Chain','The Getaway','Dirty Money Trail','The Inside Job','No Witnesses'];let placed=0;while(placed<8){let r=Math.floor(Math.random()*rows),c=Math.floor(Math.random()*cols);if(!board[r][c]){board[r][c]={asset:assets[Math.floor(Math.random()*4)]};placed++;}}const shopPool=[['Inside Man',20,'Assets inside Operations pay +1.'],['Long Con',25,'Operations of length 5+ get x2.'],['Informer',15,'Each Operation produces +2 Intel.'],['Safehouse',15,'Each Operation produces +2 Heat.'],['Wheelman',20,'Start each day with +1 Favor.'],['Mastermind',30,'Intel gains +25%.'],['Double Take',20,'After each placement, switch color again.'],['Pressure Valve',25,'Reduce daily Heat loss by 3.'],['Cash Flow',15,'Double Cash from Operations.'],['Legendary Score',40,'Length 7+ Operations get x2.']],ops=[];const boardEl=document.getElementById('board'),resourceBar=document.getElementById('resourceBar'),opsPanel=document.getElementById('opsPanel'),gameModal=document.getElementById('gameModal'),modalTitle=document.getElementById('modalTitle'),modalBody=document.getElementById('modalBody');
function opClass(len){return len>=7?'op7':len===6?'op6':len===5?'op5':'op4'}
function draw(){resourceBar.innerHTML=`<div class="resource"><div class="resourceOrb">$</div><div><div class="resourceValue">$${cash}</div><div class="resourceLabel">CASH</div></div></div><div class="resource"><div class="resourceOrb">F</div><div><div class="resourceValue">${favors}</div><div class="resourceLabel">FAVORS</div></div></div><div class="resource"><div class="resourceOrb">I</div><div><div class="resourceValue">${intel}/${intelGoal}</div><div class="resourceLabel">INTEL</div></div></div><div class="resource"><div class="resourceOrb">H</div><div><div class="resourceValue">${heat}/${maxHeat}</div><div class="resourceLabel">HEAT</div></div></div><div class="dayInfo"><b>DAY ${day}</b><br>Playing: ${turn.toUpperCase()}</div>`;let opCells={};ops.forEach((o,i)=>o.cells.forEach(([r,c])=>{if(!opCells[`${r},${c}`]||o.len>opCells[`${r},${c}`].len)opCells[`${r},${c}`]={len:o.len,index:i}}));boardEl.innerHTML='';for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){let d=document.createElement('div'),v=board[r][c],oc=opCells[`${r},${c}`];d.className='cell'+(oc?' '+opClass(oc.len):'');if(v&&v.color)d.innerHTML=`<div class="pip ${v.color}">${v.color==='blue'?'B':'R'}</div>`;if(v&&v.asset)d.innerHTML+=`<span class="asset" title="${assetNames[v.asset]}">${v.asset}</span>`;if(oc)d.innerHTML+=`<span class="optag">${oc.len}</span>`;d.onclick=()=>drop(c);boardEl.appendChild(d)}renderOperations()}
function drop(c){if(favors<=0){showStatus('No Favors left.','bad');return}for(let r=rows-1;r>=0;r--){let v=board[r][c];if(v&&v.color)continue;board[r][c]=v&&v.asset?{color:turn,asset:v.asset}:{color:turn};turn=turn==='blue'?'red':'blue';favors--;if(upgrades.includes('Double Take'))turn=turn==='blue'?'red':'blue';showStatus('','');draw();return}showStatus('That column is full.','bad')}
function scan(){let found=[],dirs=[[1,0],[0,1],[1,1],[1,-1]];for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){let cell=board[r][c];if(!cell||!cell.color)continue;for(let[dr,dc]of dirs){let before=board[r-dr]?.[c-dc];if(before?.color===cell.color)continue;let len=1,cells=[[r,c]],nr=r+dr,nc=c+dc;while(board[nr]?.[nc]?.color===cell.color){cells.push([nr,nc]);len++;nr+=dr;nc+=dc}if(len>=4)found.push({len,cells,color:cell.color})}}return found}
function calcOp(o){let mult=Math.pow(2,Math.max(0,o.len-4));if(upgrades.includes('Long Con')&&o.len>=5)mult*=2;if(upgrades.includes('Legendary Score')&&o.len>=7)mult*=2;let c=mult,i=mult,h=mult,f=0;o.cells.forEach(([r,col])=>{let a=board[r][col]?.asset;if(a==='$')c+=mult;if(a==='I')i+=mult;if(a==='H')h+=mult;if(a==='F')f++});if(upgrades.includes('Inside Man')){c++;i++;h++;f++}if(upgrades.includes('Cash Flow'))c*=2;if(upgrades.includes('Informer'))i+=2;if(upgrades.includes('Safehouse'))h+=2;return{c,i,h,f,mult}}
function renderOperations(){let content='<h3>Your Network</h3>';if(!ops.length)content+='<div class="small">No Operations yet. Build a line of 4 or more to establish your first piece of infrastructure.</div>';else content+=ops.map((o,i)=>{let x=calcOp(o),name=o.name||opNames[i%opNames.length];return `<div class="operation ${opClass(o.len)}"><b>${name}</b><span class="small">${o.len} pieces · ${o.color==='blue'?'Blue':'Red'} · pays each Day</span><div>Cash +$${x.c} · Intel +${x.i} · Heat +${x.h}${x.f?' · Favors +'+x.f:''}</div></div>`}).join('');content+=`<div class="networkActions"><button onclick="openShop()">Fence / Shop</button><button class="primary" onclick="endDay()">End Day</button></div>`;opsPanel.innerHTML=content}
function showStatus(msg,type){if(!msg)return;openModal('Notice',`<div class="${type||''}">${msg}</div>`)}
function openModal(title,body){modalTitle.textContent=title;modalBody.innerHTML=body;gameModal.classList.add('open')}
function closeModal(){gameModal.classList.remove('open')}
function openShop(){modalTitle.textContent='Fence';modalBody.innerHTML='<div class="modalHint">Spend Cash on permanent upgrades. Bought upgrades remain for the run.</div>'+shopPool.map(s=>{let owned=upgrades.includes(s[0]);return `<div class="shopItem"><button ${cash<s[1]||owned||intel>=intelGoal||heat<=0?'disabled':''} onclick="buy('${s[0].replace(/'/g,"\\'")}',${s[1]})">${owned?'Owned':'Buy $'+s[1]}</button><b>${s[0]}</b><br><small>${s[2]}</small></div>`}).join('');gameModal.classList.add('open')}
function buy(n,c){if(cash<c||upgrades.includes(n)||intel>=intelGoal||heat<=0)return;cash-=c;upgrades.push(n);openShop();draw()}
function endDay(){if(intel>=intelGoal||heat<=0)return;let newOps=[];scan().forEach(op=>{let key=JSON.stringify(op.cells);if(!ops.find(o=>o.key===key)){let active={key,len:op.len,cells:op.cells,color:op.color,name:opNames[ops.length%opNames.length]};ops.push(active);newOps.push(active)}});let dc=0,di=0,dh=0,df=0;let lines=[];ops.forEach(o=>{let x=calcOp(o);dc+=x.c;di+=x.i;dh+=x.h;df+=x.f;lines.push(`<div><b>${o.name}</b>: +$${x.c} Cash, +${x.i} Intel${x.f?' , +'+x.f+' Favors':''}</div>`)});if(upgrades.includes('Mastermind'))di=Math.ceil(di*1.25);cash+=dc;intel+=di;heat+=dh;favors+=df;let cost=Math.max(0,5+day-(upgrades.includes('Pressure Valve')?3:0));heat-=cost;let startF=3+(upgrades.includes('Wheelman')?1:0);favors+=startF;day++;let result=`<div><b>DAY ${day-1} — THE NETWORK PAYS</b></div><div class="income">${lines.join('')||'<div>No Operations paid out.</div>'}<div>Network Heat: +${dh}</div><div>Heat cost: -${cost}</div><div>Daily Favors: +${df+startF}</div></div>`;if(intel>=intelGoal)result+='<p class="good"><b>BIG SCORE COMPLETE!</b> You gathered enough Intel to pull the job.</p>';else if(heat<=0)result+='<p class="bad"><b>BUSTED.</b> The Heat caught up with you.</p>';openModal('The Network Pays',result);draw()}
gameModal.onclick=e=>{if(e.target===gameModal)closeModal()};draw();</script></body></html>
