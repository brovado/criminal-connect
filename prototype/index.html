<!DOCTYPE html><html><head><meta charset='utf-8'><title>Criminal Connect</title><style>body{font-family:Arial;background:#111;color:#eee;padding:15px}#top{display:flex;gap:20px;flex-wrap:wrap}#board{display:grid;grid-template-columns:repeat(7,60px);gap:4px;margin-top:10px}.cell{width:60px;height:60px;border:1px solid #555;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#222;cursor:pointer}.blue{background:#4a7dff}.red{background:#ff5a5a}.asset{font-size:11px;color:#ffd700}button{margin:4px}#shop button{display:block}</style></head><body><h1>Criminal Connect</h1><div id='top'><div id='hud'></div><div><button onclick='endDay()'>End Day</button><div id='status'></div></div><div id='shop'></div></div><div id='board'></div><script>const rows=6,cols=7,intelGoal=100;let day=1,turn='blue',cash=10,favors=3,intel=0,heat=20,maxHeat=20;let upgrades=[];const board=Array.from({length:rows},()=>Array(cols).fill(null));const assets=['$','F','I','H'];for(let i=0;i<8;i++){let r=Math.floor(Math.random()*rows),c=Math.floor(Math.random()*cols);board[r][c]={asset:assets[Math.floor(Math.random()*4)]}}const shopPool=[['Inside Man',20],['Long Con',25],['Informer',15],['Safehouse',15],['Wheelman',20],['Mastermind',30],['Double Take',20],['Pressure Valve',25],['Cash Flow',15],['Legendary Score',40]];const ops=[];function draw(){hud.innerHTML='Day:'+day+' Cash:'+cash+' Favors:'+favors+' Intel:'+intel+'/'+intelGoal+' Heat:'+heat+'/'+maxHeat+' Turn:'+turn;boardEl.innerHTML='';for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){let d=document.createElement('div'),v=board[r][c];d.className='cell '+((v&&v.color)||'');d.innerHTML=v&&v.asset?'<span class=asset>'+v.asset+'</span>':'';d.onclick=()=>drop(c);boardEl.appendChild(d)}renderShop()}const boardEl=document.getElementById('board'),hud=document.getElementById('hud');function drop(c){if(favors<=0)return;for(let r=rows-1;r>=0;r--){let v=board[r][c];if(!v||v.asset){let asset=v&&v.asset;board[r][c]={color:turn,asset};turn=turn==='blue'?'red':'blue';favors--;draw();return}}}function scan(){let found=[];const dirs=[[1,0],[0,1],[1,1],[1,-1]];for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){let cell=board[r][c];if(!cell||!cell.color)continue;for(let[d1,d2]of dirs){let len=1,cells=[[r,c]],nr=r+d1,nc=c+d2;while(board[nr]?.[nc]?.color===cell.color){cells.push([nr,nc]);len++;nr+=d1;nc+=d2}if(len>=4)found.push({len,cells})}}return found}function endDay(){let newOps=0;scan().forEach(op=>{let key=JSON.stringify(op.cells);if(!ops.find(o=>o.key===key)){ops.push({key,len:op.len,cells:op.cells});newOps++}});ops.forEach(o=>{let mult=Math.pow(2,Math.max(0,o.len-4));let c=1*mult,i=1*mult,h=1*mult,f=0;o.cells.forEach(([r,col])=>{let a=board[r][col].asset;if(a=='$')c+=mult;if(a=='I')i+=mult;if(a=='H')h+=mult;if(a=='F')f+=1});if(upgrades.includes('Cash Flow'))c*=2;if(upgrades.includes('Informer'))i+=2;if(upgrades.includes('Safehouse'))h+=2;cash+=c;intel+=i;heat+=h;favors+=f});heat-=5+day;if(upgrades.includes('Pressure Valve'))heat+=3;day++;favors=3+(upgrades.includes('Wheelman')?1:0)+favors;if(intel>=intelGoal){status.innerHTML='BIG SCORE COMPLETE!';}else if(heat<=0){status.innerHTML='BUSTED! Run Over';}else{status.innerHTML='Operations:'+ops.length+' New:'+newOps;}draw()}function buy(n,c){if(cash<c||upgrades.includes(n))return;cash-=c;upgrades.push(n);draw()}function renderShop(){shop.innerHTML='<h3>Shop</h3>';shopPool.forEach(s=>{shop.innerHTML+=`<button onclick="buy('${s[0]}',${s[1]})">${s[0]} $${s[1]}</button>`})}draw();</script></body></html>
