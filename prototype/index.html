<!DOCTYPE html><html><head><meta charset='utf-8'><title>Criminal Connect Prototype</title><style>body{font-family:Arial;padding:20px}#board{display:grid;grid-template-columns:repeat(7,60px);gap:4px}.cell{width:60px;height:60px;border:1px solid #999;border-radius:50%;display:flex;align-items:center;justify-content:center}.blue{background:#4a7dff}.red{background:#ff5a5a}</style></head><body><h1>Criminal Connect Prototype</h1><p>MVP scaffold: alternate Blue/Red placement, persistent board, end-day scoring pending.</p><div id='board'></div><script>const rows=6,cols=7;let turn='blue';let board=Array.from({length:rows},()=>Array(cols).fill(null));const el=document.getElementById('board');function draw(){el.innerHTML='';for(let r=0;r<rows;r++){for(let c=0;c<cols;c++){const d=document.createElement('div');d.className='cell '+(board[r][c]||'');d.onclick=()=>drop(c);el.appendChild(d)}}}function drop(c){for(let r=rows-1;r>=0;r--){if(!board[r][c]){board[r][c]=turn;turn=turn==='blue'?'red':'blue';draw();return;}}}draw();</script></body></html>
