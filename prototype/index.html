<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Criminal Connect</title><style>body{font-family:Arial,sans-serif;background:#111;color:#eee;padding:15px;max-width:900px;margin:auto}.panel{background:#1b1b1b;border:1px solid #333;border-radius:8px;padding:12px}.top{display:flex;gap:15px;flex-wrap:wrap;align-items:flex-start}#board{display:grid;grid-template-columns:repeat(7,64px);gap:5px;margin-top:15px;background:#181818;padding:8px;border-radius:8px;width:max-content}.cell{width:64px;height:64px;border:1px solid #555;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#222;cursor:pointer;position:relative;box-sizing:border-box}.cell:hover{border-color:#aaa}.pip{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#fff}.blue{background:#4a7dff}.red{background:#ff5a5a}.asset{position:absolute;bottom:2px;right:2px;width:19px;height:19px;border-radius:50%;background:#111;border:1px solid #ffd700;color:#ffd700;font-size:11px;display:flex;align-items:center;justify-content:center;z-index:3}button{margin:4px;padding:7px 10px;background:#292929;color:#eee;border:1px solid #555;border-radius:5px;cursor:pointer}button:hover{background:#383838}button:disabled{opacity:.4;cursor:not-allowed}#shop button{display:block;width:200px;text-align:left}.stat{margin:3px 0}.good{color:#8fda8f}.bad{color:#ff7777}</style></head><body><h1>Criminal Connect</h1><div class="top"><div class="panel"><div id="hud"></div></div><div class="panel"><button onclick="endDay()">End Day</button><div id="status"></div></div><div class="panel"><div id="shop"></div></div></div><div id="board"></div><script>
const rows=6,cols=7,intelGoal=100;let day=1,turn='blue',cash=10,favors=3,intel=0,heat=20,maxHeat=20,upgrades=[];const board=Array.from({length:rows},()=>Array(cols).fill(null)),assets=['$','F','I','H'];const assetNames={'$':'Cash','F':'Favor','I':'Intel','H':'Heat'};let placed=0;while(placed<8){let r=Math.floor(Math.random()*rows),c=Math.floor(Math.random()*cols);if(!board[r][c]){board[r][c]={asset:assets[Math.floor(Math.random()*4)]};placed++;}}const shopPool=[['Inside Man',20,'Assets inside Operations pay +1.'],['Long Con',25,'Operations of length 5+ get x2.'],['Informer',15,'Each Operation produces +2 Intel.'],['Safehouse',15,'Each Operation produces +2 Heat.'],['Wheelman',20,'Start each day with +1 Favor.'],['Mastermind',30,'Intel gains +25%.'],['Double Take',20,'After each placement, switch color again.'],['Pressure Valve',25,'Reduce daily Heat loss by 3.'],['Cash Flow',15,'Double Cash from Operations.'],['Legendary Score',40,'Length 7+ Operations get x2.']],ops=[];const boardEl=document.getElementById('board'),hud=document.getElementById('hud'),shop=document.getElementById('shop'),status=document.getElementById('status');
function draw(){hud.innerHTML=`<div class="stat"><b>Day ${day}</b></div><div class="stat">Cash: $${cash}</div><div class="stat">Favors: ${favors}</div><div class="stat">Intel: ${intel}/${intelGoal}</div><div class="stat">Heat: ${heat}/${maxHeat}</div><div class="stat">Turn: ${turn.toUpperCase()}</div><div class="stat">Operations: ${ops.length}</div>`;boardEl.innerHTML='';for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){let d=document.createElement('div'),v=board[r][c];d.className='cell';if(v&&v.color)d.innerHTML=`<div class="pip ${v.color}">${v.color==='blue'?'B':'R'}</div>`;if(v&&v.asset)d.innerHTML+=`<span class="asset" title="${assetNames[v.asset]}">${v.asset}</span>`;d.onclick=()=>drop(c);boardEl.appendChild(d)}renderShop()}
function drop(c){if(favors<=0){status.innerHTML='<span class="bad">No Favors left.</span>';return}for(let r=rows-1;r>=0;r--){let v=board[r][c];if(v&&v.color)continue;if(v&&v.asset&&!v.color)continue;board[r][c]={color:turn};turn=turn==='blue'?'red':'blue';favors--;if(upgrades.includes('Double Take'))turn=turn==='blue'?'red':'blue';status.innerHTML='';draw();return}status.innerHTML='<span class="bad">That column is full.</span>'}
function scan(){let found=[],dirs=[[1,0],[0,1],[1,1],[1,-1]];for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){let cell=board[r][c];if(!cell||!cell.color)continue;for(let[dr,dc]of dirs){let before=board[r-dr]?.[c-dc];if(before?.color===cell.color)continue;let len=1,cells=[[r,c]],nr=r+dr,nc=c+dc;while(board[nr]?.[nc]?.color===cell.color){cells.push([nr,nc]);len++;nr+=dr;nc+=dc}if(len>=4)found.push({len,cells,color:cell.color})}}return found}
function endDay(){if(intel>=intelGoal||heat<=0)return;let newOps=[];scan().forEach(op=>{let key=JSON.stringify(op.cells);if(!ops.find(o=>o.key===key)){let active={key,len:op.len,cells:op.cells,color:op.color};ops.push(active);newOps.push(active)}});let dc=0,di=0,dh=0,df=0;ops.forEach(o=>{let mult=Math.pow(2,Math.max(0,o.len-4));if(upgrades.includes('Long Con')&&o.len>=5)mult*=2;if(upgrades.includes('Legendary Score')&&o.len>=7)mult*=2;let c=mult,i=mult,h=mult,f=0;o.cells.forEach(([r,col])=>{let a=board[r][col]?.asset;if(a==='$')c+=mult;if(a==='I')i+=mult;if(a==='H')h+=mult;if(a==='F')f++});if(upgrades.includes('Inside Man')){c++;i++;h++;f++}if(upgrades.includes('Cash Flow'))c*=2;if(upgrades.includes('Informer'))i+=2;if(upgrades.includes('Safehouse'))h+=2;dc+=c;di+=i;dh+=h;df+=f});if(upgrades.includes('Mastermind'))di=Math.ceil(di*1.25);cash+=dc;intel+=di;heat+=dh;favors+=df;let cost=Math.max(0,5+day-(upgrades.includes('Pressure Valve')?3:0));heat-=cost;let startF=3+(upgrades.includes('Wheelman')?1:0);favors+=startF;status.innerHTML=`Day closed. ${newOps.length} new Operation${newOps.length===1?'':'s'} established. <span class="good">+$${dc} Cash, +${di} Intel, +${df+startF} Favors</span>. Heat cost: -${cost}.`;day++;if(intel>=intelGoal)status.innerHTML='<span class="good"><b>BIG SCORE COMPLETE!</b> You gathered enough Intel to pull the job.</span>';else if(heat<=0)status.innerHTML='<span class="bad"><b>BUSTED.</b> The Heat caught up with you.</span>';draw()}
function buy(n,c){if(cash<c||upgrades.includes(n)||intel>=intelGoal||heat<=0)return;cash-=c;upgrades.push(n);status.innerHTML=`Bought <b>${n}</b>.`;draw()}function renderShop(){shop.innerHTML='<h3>Fence</h3>';shopPool.forEach(s=>{let b=document.createElement('button');b.disabled=cash<s[1]||upgrades.includes(s[0])||intel>=intelGoal||heat<=0;b.innerHTML=`<b>${s[0]}</b> — $${s[1]}<br><small>${s[2]}</small>`;b.onclick=()=>buy(s[0],s[1]);shop.appendChild(b)})}draw();</script></body></html>
